<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>README-Gen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --color-bg: #f8fafc;
            --color-surface: #ffffff;
            --color-primary: #6366f1;
            --color-primary-hover: #4f46e5;
            --color-text: #1e293b;
            --color-text-muted: #64748b;
            --color-border: #e2e8f0;
            --color-error: #ef4444;
            --color-error-bg: #fef2f2;
            --radius: 12px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
        }

        .hero {
            text-align: center;
            padding: 80px 20px 60px;
            background: linear-gradient(180deg, #eef2ff 0%, var(--color-bg) 100%);
        }

        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .hero h1 span { color: var(--color-primary); }

        .hero p {
            color: var(--color-text-muted);
            font-size: 1.1rem;
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }

        .main { max-width: 780px; margin: 0 auto; padding: 0 20px 80px; }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .form-row { display: flex; gap: 10px; align-items: stretch; }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 14px 14px 42px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }

        select {
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            background: var(--color-surface);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus { border-color: var(--color-primary); }

        .btn {
            padding: 14px 28px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn:hover { background: var(--color-primary-hover); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { background: #c7d2fe; cursor: not-allowed; transform: none; }

        .error {
            color: var(--color-error);
            background: var(--color-error-bg);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fecaca;
        }

        .output {
            display: none;
            position: relative;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .output-header span {
            font-weight: 600;
            font-size: 14px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-copy {
            padding: 6px 14px;
            font-size: 13px;
            background: transparent;
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-copy:hover { background: #eef2ff; }

        .output-content { line-height: 1.7; font-size: 15px; }
        .output-content h1 { font-size: 1.8rem; margin: 24px 0 12px; }
        .output-content h2 { font-size: 1.4rem; margin: 20px 0 10px; color: var(--color-text); }
        .output-content h3 { font-size: 1.1rem; margin: 16px 0 8px; }
        .output-content p { margin-bottom: 12px; }
        .output-content ul, .output-content ol { margin: 8px 0 12px 24px; }
        .output-content li { margin-bottom: 4px; }

        .output-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 16px 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            font-size: 13px;
        }

        .output-content code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
        }

        .output-content :not(pre) > code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--color-primary);
        }

        .output-content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
        .output-content th, .output-content td { border: 1px solid var(--color-border); padding: 10px 14px; text-align: left; font-size: 14px; }
        .output-content th { background: #f8fafc; font-weight: 600; }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 48px 0;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { color: var(--color-text-muted); font-size: 14px; }

        @media (max-width: 600px) {
            .form-row { flex-direction: column; }
            .hero h1 { font-size: 1.8rem; }
            .hero { padding: 50px 20px 40px; }
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>README<span>-Gen</span></h1>
        <p>Generate comprehensive README documentation for any GitHub repository powered by LLMs and ATORAK principles.</p>
    </div>

    <div class="main">
        <div class="card">
            <div class="form-row">
                <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
                    <input type="text" id="url-input" placeholder="https://github.com/user/repository">
                </div>
                <select id="model-select">
                    <option value="gpt">GPT</option>
                    <option value="gemini">Gemini</option>
                </select>
                <button class="btn" id="generate-btn" onclick="generate()">Generate</button>
            </div>
        </div>

        <div id="error" class="error"></div>

        <div id="output" class="output card">
            <div class="output-header">
                <span>Generated README</span>
                <button class="btn-copy" onclick="copyOutput()">Copy Markdown</button>
            </div>
            <div id="output-content" class="output-content"></div>
        </div>
    </div>

    <script>
        let rawMarkdown = '';

        function stripMarkdownFence(text) {
            return text.replace(/^```(?:md|markdown)?\s*\n?/, '').replace(/\n?```\s*$/, '');
        }

        async function generate() {
            const url = document.getElementById('url-input').value.trim();
            const model = document.getElementById('model-select').value;
            const btn = document.getElementById('generate-btn');
            const output = document.getElementById('output');
            const content = document.getElementById('output-content');
            const error = document.getElementById('error');

            if (!url) {
                error.style.display = 'block';
                error.textContent = 'Please enter a GitHub repository URL.';
                return;
            }

            error.style.display = 'none';
            output.style.display = 'block';
            content.innerHTML = '<div class="loading"><div class="spinner"></div><span class="loading-text">Generating README — this may take a moment...</span></div>';
            btn.disabled = true;

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, model })
                });

                const data = await res.json();

                if (!res.ok || data.error) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }

                rawMarkdown = stripMarkdownFence(data.response);
                content.innerHTML = marked.parse(rawMarkdown);
            } catch (e) {
                output.style.display = 'none';
                error.style.display = 'block';
                error.textContent = e.message;
            } finally {
                btn.disabled = false;
            }
        }

        function copyOutput() {
            navigator.clipboard.writeText(rawMarkdown).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy Markdown'; }, 2000);
            });
        }

        document.getElementById('url-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
